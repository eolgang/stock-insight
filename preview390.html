<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>mobile preview</title>
<style>body{margin:0;background:#222;font-family:sans-serif}iframe{border:0;display:block;background:#080a0f}</style></head>
<body><iframe id="f" src="./index.html#screener" width="390" height="1400"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var w = this.contentWindow;
  setTimeout(function () {
    var el = w.document.querySelector('.sec-head');
    if (el) w.scrollTo(0, el.offsetTop - 60);
  }, 2500);
});
</script>
</body></html>
