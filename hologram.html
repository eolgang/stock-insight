<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌌 얼미 브리핑 · 3D 홀로그램</title>
<meta name="description" content="얼미리서치 3D 홀로그램 브리핑 — 날씨·미국 증시·한국 증시·핵심 일정을 음성과 자비스 스타일 홀로그램 씬으로. 매일 아침 브리핑 데이터로 갱신됩니다.">
<meta name="theme-color" content="#020906">
<meta property="og:title" content="얼미리서치 · 3D 홀로그램 브리핑">
<meta property="og:description" content="날씨 → 미국 증시 → 한국 증시 → 일정, 음성으로 흐르는 홀로그램 브리핑.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="hologram.css?v=20261122r">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="holo-canvas" aria-hidden="true"></canvas>
<div class="bg-fallback" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header class="hud-top">
  <a class="brand" href="index.html">
    <span class="brand-dot" aria-hidden="true"></span><b>얼미 브리핑</b>
  </a>
  <div class="hud-right">
    <span class="hud-date" id="hudDate">2026. 11. 22 · 일요일</span>
    <a class="hud-back" href="index.html"><span aria-hidden="true">‹</span>얼미리서치</a>
  </div>
</header>

<div class="intro" id="intro">
  <div class="intro-head">
    <p class="intro-kicker">EOLMI · HOLOGRAM BRIEFING</p>
    <div class="intro-num" id="introNum">11.22</div>
    <p class="intro-sub" id="introSub"></p>
  </div>
  <button class="intro-play" id="btnStartSound" type="button" aria-label="브리핑 재생">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8L19.4 12z" fill="currentColor"/></svg>
  </button>
  <button class="intro-silent" id="btnStartSilent" type="button">소리 없이 3D만 보기</button>
</div>

<div class="subtitle" id="subtitle" aria-live="polite"></div>

<main class="player" id="player">
  <button class="p-btn" id="btnPlay" type="button" aria-label="재생">
    <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8L19.4 12z" fill="currentColor"/></svg>
    <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.6 5h3.1v14H7.6zM13.3 5h3.1v14h-3.1z" fill="currentColor"/></svg>
    <svg class="ico-restart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.2V2.4L7.2 6.1 12 9.8V7a5.3 5.3 0 1 1-5.3 5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="p-track" id="track" role="slider" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="45" aria-valuenow="0" tabindex="0">
    <div class="p-fill" id="fill"></div>
    <div class="p-marks" id="marks"></div>
  </div>
  <span class="p-time" id="tNow">0:00</span>
  <button class="p-ico on" id="btnRestart" type="button" aria-label="다시보기" title="다시보기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.2V2.4L7.2 6.1 12 9.8V7a5.3 5.3 0 1 1-5.3 5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="p-ico on" id="btnMute" type="button" aria-label="소리 끄기" title="소리">
    <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.6 9.3h3.2L11.4 5.6v12.8L6.8 14.7H3.6z" fill="currentColor"/>
      <path d="M14.6 8.8a4.2 4.2 0 0 1 0 6.4M17.1 6.4a7.6 7.6 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.6 9.3h3.2L11.4 5.6v12.8L6.8 14.7H3.6z" fill="currentColor"/>
      <path d="M14.8 9.4l4.6 5.2m0-5.2l-4.6 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</main>

<div class="no3d-fallback" id="no3dCap" aria-hidden="true">
  <div class="n-big" id="nfBig"></div>
  <div class="n-sub" id="nfSub"></div>
  <div class="n-cap" id="nfCap"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<audio id="voice" preload="auto" playsinline></audio>
<script type="module" src="hologram.js?v=20261122b3"></script>
<script>
  // 모듈/CDN 로딩이 막힌 환경: 3D 없이 자막·음성만이라도 돌게 한다.
  setTimeout(function () {
    if (!window.__holoBooted) {
      document.body.classList.add('no3d');
      var t = document.getElementById('toast');
      if (t) { t.textContent = '3D 라이브러리를 불러오지 못했습니다. 음성·자막으로 재생합니다.'; t.classList.add('show'); }
    }
  }, 7000);
</script>
</body>
</html>
